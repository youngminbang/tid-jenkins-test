<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo List 앱</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>📝 나의 할 일 목록</h1>
        </header>

        <div class="input-section">
            <input
                type="text"
                id="todoInput"
                placeholder="새로운 할 일을 입력하세요..."
                autocomplete="off"
            >
            <button id="addBtn">추가</button>
        </div>

        <div class="filter-section">
            <button class="filter-btn active" data-filter="all">전체</button>
            <button class="filter-btn" data-filter="active">진행중</button>
            <button class="filter-btn" data-filter="completed">완료</button>
        </div>

        <ul id="todoList" class="todo-list">
            <!-- Todos will be inserted here dynamically -->
        </ul>

        <div class="stats">
            <span id="todoCount">0개의 할 일</span>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
